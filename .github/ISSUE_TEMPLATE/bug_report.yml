name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! Please check the existing issues first.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open "Flam Tap"
        2. Set 120 BPM and press Practice
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 7, Android 15"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where did you install it from?
      options:
        - GitHub release
        - F-Droid
        - Built it myself
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, headphones used (Bluetooth or wired), calibration value…
