name: Feature request
description: Suggest an idea for Paradiddle
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the practice need, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could the app help with it?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
