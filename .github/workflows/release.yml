name: Release

# Push a tag like v1.0.0 (or v1.1.0-beta1 for a pre-release) to publish a signed APK.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No release signing key configured (RELEASE_KEYSTORE_BASE64), so nothing is published. See CONTRIBUTING.md > Releasing."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and build signed APK
        if: steps.key.outputs.ready == 'true'
        env:
          PARADIDDLE_KEYSTORE: ${{ runner.temp }}/release.jks
          PARADIDDLE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          PARADIDDLE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          PARADIDDLE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew test assembleRelease --stacktrace

      - name: Publish GitHub release
        if: steps.key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          apk="paradiddle-${version}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          flags=(--title "Paradiddle ${version}" --generate-notes)
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "$apk" "$apk.sha256" "${flags[@]}"
